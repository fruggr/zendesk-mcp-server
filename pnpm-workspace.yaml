allowBuilds:
  esbuild: true
  # lefthook's postinstall only downloads its Go binary as a fallback; the
  # binary already ships in the platform optional dependency, so the CLI works
  # with the build script blocked. Kept false deliberately.
  lefthook: false
  msw: true

# 3 days. This is the gate that governs transitive dependencies: Renovate does
# not manage them, so a vulnerable indirect package is only ever bumped by the
# twice-weekly lockFileMaintenance run, and pnpm refuses any version younger than
# this when that run resolves the tree. Supply-chain compromises are typically
# caught and yanked within 24-48h, so 3 days keeps a margin over that window
# while 5 added two days to every remediation for little more protection.
# Keep it equal to minimumReleaseAge in renovate.json.
minimumReleaseAge: 4320

overrides:
  ip-address: ^10.2.0
  conventional-changelog-writer: ^9.2.0
  # typed-rest-client depends on the exact version `qs@6.15.1`, which no longer
  # receives fixes, so neither lockFileMaintenance nor Renovate can move it and
  # the advisory stays open indefinitely. express already resolves 6.15.3 in this
  # tree, so the override also deduplicates qs to a single version.
  qs: ^6.15.3

patchedDependencies:
  '@stryker-mutator/vitest-runner@10.0.0': patches/@stryker-mutator__vitest-runner@10.0.0.patch
