# CodeRabbit configuration.
# Schema reference: https://docs.coderabbit.ai/reference/configuration
# Only keys documented in the official schema are set here. New options
# should be added with a comment linking to the doc that introduced them.

language: en-US

reviews:
  profile: chill
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_filters:
    - '!dist/**'
    - '!node_modules/**'
    - '!coverage/**'
    - '!pnpm-lock.yaml'
    - '!CHANGELOG.md'
  path_instructions:
    - path: 'src/tools/**'
      instructions: |
        These files define MCP tools exposed to the LLM. Check that:
        - The Zod schema validates all inputs and matches the handler's usage.
        - The first sentence of the tool description reads as a self-contained
          summary (proxy modes only surface that first sentence).
        - Any new, renamed, or removed tool is reflected in README.md and
          AGENTS.md (tool tables and per-namespace counts).

        Score each tool definition against Glama's TDQS rubric
        (github.com/glama-ai/tool-definition-quality-score). Core rule: a
        description must add value BEYOND the structured fields — give no credit
        for text that merely repeats the tool name, the input schema, or the
        annotations. Use the full 1-5 range (3 = minimum viable; 4-5 only for
        genuinely helpful). tests/unit/tools/tool-quality.test.ts is the
        deterministic FLOOR (a param description exists and isn't a bare
        name-echo, description is >1 sentence, write tools state an effect); you
        are the judgment CEILING it can't automate. Flag, naming the dimension:
        - Purpose Clarity: a description that just restates the tool name.
        - Usage Guidelines: no "when to use it / when to prefer a sibling tool"
          (use the sibling tool names for disambiguation).
        - Behavioral Transparency: side effects, mutations or idempotency not
          disclosed — and score WORST any description that CONTRADICTS the
          annotations (readOnlyHint, destructiveHint, idempotentHint).
        - Parameter Semantics: a `.describe()` that adds nothing over the field's
          name, type, or schema constraints.
        - Conciseness & Structure: padding, or the key point not front-loaded in
          the first sentence (proxy modes surface only that first sentence).
        - Contextual Completeness: anything an agent needs to call the tool
          without reading the source.
        Also flag factual claims about Zendesk API behavior (tags, locales,
        pagination) that look unverified or wrong.
    - path: 'tests/**'
      instructions: |
        Zendesk API calls in tests must go through MSW handlers in
        tests/msw-handlers.ts. Flag any test that hits the real network.
    - path: '.github/workflows/**'
      instructions: |
        This project pins first-party actions (actions/*, pnpm/action-setup)
        to floating major tags (@vN) by design. Do not raise unpinned-uses
        / "pin to commit SHA" findings on these actions — the trade-off was
        discussed and decided in issue #32. Renovate opens a PR when a new
        major lands, and bumps go through normal review.

knowledge_base:
  learnings:
    scope: local
