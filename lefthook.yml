# Git hooks. Installed by the `prepare` script on `pnpm install`.
#
# Linting and formatting run at different stages on purpose: lint feedback is
# worth having on every edit (the Claude Code PostToolUse hook, see
# .claude/settings.json), formatting only matters before code is shared. The
# measurements behind that split are in docs/decisions/lint-tooling.md.
#
# This is the stage that formats, sorts imports, and runs the full lint —
# including the two `types`-domain rules the per-edit hook skips for speed.
pre-commit:
  jobs:
    - name: biome
      # No `glob` on purpose: every staged file goes to Biome and Biome decides,
      # which leaves `biome.json` `files.includes` the single source of truth
      # for the perimeter on both the pre-commit and the `pnpm check` side, so
      # the two cannot disagree. Don't add a filter back — a path list or an
      # extension list is a second perimeter that drifts from the first. The
      # extension list this replaced had already drifted: it omitted `.mts`
      # (which `biome.json` carries an override for), `.tsx`, `.cts`, `.jsx` and
      # `.css`, all of which Biome parses, so staging one skipped pre-commit and
      # failed in CI instead.
      # Files Biome cannot parse cost nothing and fail nothing — it skips them
      # with a verbose-only `files/missingHandler`, so a docs-only commit
      # reports `Checked 0 files` and exits 0 (`--no-errors-on-unmatched`
      # covers the empty set). Why the glob went away rather than growing:
      # docs/decisions/lint-tooling.md.
      run: node scripts/biome.mjs check --write --error-on-warnings --no-errors-on-unmatched {staged_files}
      stage_fixed: true
