name: Mutation baseline cache
description: >-
  Set up Node/pnpm, then compute the mutation baseline cache key and restore it.
  Both mutation jobs use this so the invalidation rule exists in exactly one
  place: the two jobs must agree on cache identity, and only one of them writes.

outputs:
  prefix:
    description: Restore-key prefix — matches any baseline built from the same inputs.
    value: ${{ steps.key.outputs.prefix }}
  exact:
    description: Full key for this commit. The save key; immutable once written.
    value: ${{ steps.key.outputs.exact }}

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash

    # THE INVALIDATION RULE — the only list of its kind in the setup, and the
    # one place it belongs. It is *not* "the files that matter to mutation
    # testing": it is the complement of what Stryker's incremental mode can
    # diff for itself, which is mutated sources plus the test files it
    # discovers. Those two are deliberately absent below — hashing `src/**` or
    # `tests/**/*.test.ts` here would throw the baseline away on every commit
    # and buy nothing, because incremental mode already handles them correctly.
    # Everything else that can flip a verdict has to be hashed, because nothing
    # else will notice it changed.
    #
    # When to add an entry: a new file that changes how the tests *behave*
    # without being one of the test files Stryker discovers — another setup
    # file, another shared fixture or harness, a runner config. Not docs, not
    # workflows, not the mutate scope. The table in
    # docs/decisions/mutation-testing.md states the same rule as an allowlist.
    #
    # The trailing commit sha keeps every save unique (Actions cache entries are
    # immutable, so a fixed key would freeze the first baseline forever); the
    # prefix restore-key is what allows falling back to main's latest, and it is
    # safe precisely because the inputs hash sits inside it. A broader
    # restore-key would reintroduce the stale reuse this exists to prevent.
    - name: Compute the baseline cache key
      id: key
      shell: bash
      env:
        PREFIX: mutation-baseline-${{ hashFiles('pnpm-lock.yaml', 'stryker.config.mjs', 'vitest.config.ts', 'tests/setup.ts', 'tests/msw-handlers.ts', 'tests/integration/harness.ts', '.nvmrc') }}
      run: |
        echo "prefix=${PREFIX}-" >> "$GITHUB_OUTPUT"
        echo "exact=${PREFIX}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

    - name: Restore the mutation baseline
      uses: actions/cache/restore@v6
      with:
        path: reports/mutation/stryker-incremental.json
        key: ${{ steps.key.outputs.exact }}
        restore-keys: ${{ steps.key.outputs.prefix }}
