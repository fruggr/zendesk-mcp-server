name: Mutation baseline cache
description: >-
  Set up Node/pnpm, compute the mutation baseline cache key, restore it. Both
  jobs use this so the invalidation rule below lives in exactly one place.

inputs:
  restore:
    description: >-
      'false' skips the restore, so Stryker runs every mutant against the
      current inputs: the weekly cold baseline in mutation.yml.
    default: 'true'

outputs:
  prefix:
    description: Restore-key prefix — matches any baseline built from the same inputs.
    value: ${{ steps.key.outputs.prefix }}
  exact:
    description: Full key for this run. The save key; immutable once written.
    value: ${{ steps.key.outputs.exact }}

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash

    # THE INVALIDATION RULE. Selection is mechanical, in three parts:
    #   1. the installed packages the suite can load, and package.json minus
    #      its version fields — scripts/mutation-cache-inputs.mjs derives that
    #      set from the imports, so a bump of a tool nothing imports (Biome,
    #      lefthook, semantic-release) keeps the baseline;
    #   2. the runner configs, .nvmrc, and that script itself;
    #   3. every file under tests/ except *.test.ts and tests/functional/.
    # Part 3 is asserted by tests/unit/mutation-scope.test.ts, so this list
    # cannot drift silently. `src/**` and *.test.ts are absent on purpose:
    # Stryker's incremental mode diffs those itself. Why each part is what it is:
    # docs/decisions/mutation-testing.md, §4.
    - name: Fingerprint the packages that can change a verdict
      id: packages
      shell: bash
      run: echo "hash=$(node scripts/mutation-cache-inputs.mjs)" >> "$GITHUB_OUTPUT"

    #
    # Key = prefix + sha + run (cache entries are immutable, so a fixed key would
    # freeze the first baseline, and a re-run of a commit that saved a partial
    # could not save the rest); the prefix restore-key, which takes the newest
    # entry, is safe to fall back on only because the inputs hash sits inside it.
    - name: Compute the baseline cache key
      id: key
      shell: bash
      env:
        PREFIX: mutation-baseline-${{ steps.packages.outputs.hash }}-${{ hashFiles('scripts/mutation-cache-inputs.mjs', 'stryker.config.mjs', 'vitest.config.ts', 'tests/setup.ts', 'tests/msw-handlers.ts', 'tests/tool-context.ts', 'tests/tool-result.ts', 'tests/sla-service.ts', 'tests/integration/harness.ts', 'tests/integration/core-scenarios.ts', 'tests/integration/fixture-server.ts', 'tests/integration/stdio-harness.ts', 'tests/integration/http-harness.ts', 'tests/integration/oauth-client.ts', 'tests/integration/tools-list/list-exposed-tools.ts', 'tests/tool-definitions/checks.ts', 'tests/tool-definitions/surface.ts', '.nvmrc') }}
      run: |
        echo "prefix=${PREFIX}-" >> "$GITHUB_OUTPUT"
        echo "exact=${PREFIX}-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

    - name: Restore the mutation baseline
      if: inputs.restore == 'true'
      uses: actions/cache/restore@v6
      with:
        path: reports/mutation/stryker-incremental.json
        key: ${{ steps.key.outputs.exact }}
        restore-keys: ${{ steps.key.outputs.prefix }}
