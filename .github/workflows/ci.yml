name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # The suite finishes in well under a minute; a wedged test or runner
    # should fail fast instead of holding the job for the 6-hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      # Deprecated config is only an `info`, which `--error-on-warnings` lets
      # through; `migrate` has no check mode, hence write-then-diff.
      - name: Biome config needs no migration
        run: |
          node scripts/biome.mjs migrate --write
          git diff --exit-code biome.json

      - run: pnpm typecheck

      - run: pnpm test:coverage

      - name: Coverage summary
        if: always()
        run: |
          set -euo pipefail
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${t[k].pct}% (${t[k].covered}/${t[k].total}) |`;
              console.log("| Metric | Coverage |\n| --- | --- |");
              ["lines","statements","functions","branches"].forEach((k) => console.log(row(k)));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
          if-no-files-found: warn

      - run: pnpm build

      - run: node scripts/smoke-test.mjs

      # The built bundle, in its own process: what the tests above import from
      # src/ is not what ships.
      - run: pnpm exec vitest run --config vitest.dist.config.ts

      - run: pnpm pack --pack-destination .

      - uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: '*.tgz'
          retention-days: 1
          if-no-files-found: error

  smoke-node-floor:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tarball

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install -g ./*.tgz

      - name: Verify tarball runs on the engines floor (Node 22)
        run: |
          set -euo pipefail
          # `sleep` holds stdin open for the whole run. A step's stdin is
          # /dev/null, which reaches EOF immediately, and EOF now shuts the
          # stdio server down — without this the job would silently stop
          # testing that the tarball *runs* and start testing that it exits.
          # The EOF path itself is asserted in scripts/smoke-test.mjs.
          OUT=$(sleep 6 | env LOG_LEVEL=info timeout 5 zendesk-mcp-server smoke-test 2>&1 || true)
          echo "$OUT"
          echo "$OUT" | grep -q "stdio_transport_ready"

      # dist/ inlines every dependency: installing the tarball must add nothing
      # else, and both transports must start from it alone.
      - name: Verify the package installs no dependency and serves HTTP
        run: |
          set -euo pipefail
          mkdir app && cd app && npm init -y > /dev/null
          npm install ../*.tgz
          EXTRA=$(npm ls --all --parseable | grep '/node_modules/' | grep -v '/node_modules/@fruggr/zendesk-mcp-server$' || true)
          if [ -n "$EXTRA" ]; then echo "unexpected packages installed:"; echo "$EXTRA"; exit 1; fi
          test -f node_modules/@fruggr/zendesk-mcp-server/dist/THIRD-PARTY-NOTICES.md
          OUT=$(sleep 6 | env ZENDESK_SUBDOMAIN=smoke-test LOG_LEVEL=info OAUTH_STORE=memory:// timeout 5 npx zendesk-mcp-server --transport http --port 0 2>&1 || true)
          echo "$OUT"
          echo "$OUT" | grep -q "http_transport_ready"
