name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm typecheck

      - run: pnpm test:coverage

      - name: Coverage summary
        if: always()
        run: |
          set -euo pipefail
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${t[k].pct}% (${t[k].covered}/${t[k].total}) |`;
              console.log("| Metric | Coverage |\n| --- | --- |");
              ["lines","statements","functions","branches"].forEach((k) => console.log(row(k)));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
          if-no-files-found: warn

      - run: pnpm build

      - run: node scripts/smoke-test.mjs

      - run: pnpm pack --pack-destination .

      - uses: actions/upload-artifact@v7
        with:
          name: tarball
          path: '*.tgz'
          retention-days: 1
          if-no-files-found: error

  smoke-node20:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tarball

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - run: npm install -g ./*.tgz

      - name: Verify tarball runs on Node 20
        run: |
          set -euo pipefail
          OUT=$(timeout 5 zendesk-mcp-server smoke-test 2>&1 || true)
          echo "$OUT"
          echo "$OUT" | grep -q "running via stdio"
