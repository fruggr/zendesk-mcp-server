name: Base image (build stage)

# Twin of base-image.yml for the -dev build stage, never shipped but rebuilt
# by DHI far more often than the runtime image: Docker Scout compares it with
# the base branch's and comments the packages and CVEs that changed. Its own
# workflow because Scout keys its PR comment on (command, workflow).
on:
  pull_request:
    paths:
      - Dockerfile
      - .github/workflows/base-image-build.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The build stage is the FROM named "AS build". A miss fails the job: an
      # empty image would compare against nothing.
      - id: base
        run: |
          set -euo pipefail
          build() { grep -iE '^FROM .+ AS build[[:space:]]*$' | awk '{print $2}' | grep .; }
          after=$(build < Dockerfile)
          before=$(git show "${{ github.event.pull_request.base.sha }}:Dockerfile" | build)
          echo "after=$after" >> "$GITHUB_OUTPUT"
          echo "before=$before" >> "$GITHUB_OUTPUT"
          if [ "$before" != "$after" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - if: steps.base.outputs.changed == 'true'
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - if: steps.base.outputs.changed == 'true'
        uses: docker/scout-action@v1
        with:
          command: compare
          image: registry://${{ steps.base.outputs.after }}
          to: registry://${{ steps.base.outputs.before }}
          platform: linux/amd64
          ignore-unchanged: true
          dockerhub-user: ${{ secrets.DHI_USERNAME }}
          dockerhub-password: ${{ secrets.DHI_TOKEN }}
          registry-user: ${{ secrets.DHI_USERNAME }}
          registry-password: ${{ secrets.DHI_TOKEN }}
