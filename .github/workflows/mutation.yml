name: Mutation testing

# `diff-gate` mutates a PR's changed *lines*; `baseline` runs the full scope on
# main and is the only writer of the incremental cache the gate restores.
# Design, costs and the reasoning behind every choice below:
# docs/decisions/mutation-testing.md

on:
  # Both unfiltered on purpose: a path-filtered *required* check never reports,
  # and a `paths:` list here would be a second copy of the cache key's rule. Why
  # that trade is right: the ADR, §4.
  pull_request:
  # `Changed lines` is a required check: it must report on the queue's commit too.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diff-gate:
    name: Changed lines
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    # Normally under a minute; slack for a lot of logic at once, or a cold cache.
    timeout-minutes: 25
    concurrency:
      group: mutation-gate-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the gate diffs the PR base against this merge commit
          persist-credentials: false # neither job pushes (zizmor `artipacked`)

      - uses: ./.github/actions/mutation-baseline

      # Before the gate, and unconditionally. A dependency-only PR changes no
      # mutated line, so the gate below finds nothing to judge and reports a
      # vacuous pass — which is exactly how #292 switched the gate off without a
      # single red check. The canary mutates a two-line fixture whose verdicts
      # are fixed by construction, so it is the one signal such a PR gets. ~3 s.
      # `shell: bash` for `-eo pipefail`, same reason as the gate step below.
      - name: Canary — is the mutation gate still measuring anything?
        shell: bash
        run: pnpm test:mutation:canary | tee -a "$GITHUB_STEP_SUMMARY"

      # Two things here are load-bearing and look removable. `shell: bash` gives
      # `-eo pipefail`; the default `bash -e` has none, so `tee` would swallow the
      # gate's exit 1 and every failure would report green (measured). `HEAD`, not
      # `head.sha`: checkout gives us the merge commit, and the line numbers must
      # match the tree Stryker mutates. Both explained in full in the ADR, §4.
      # In the merge queue, HEAD is the queue commit and `base_sha` its parent:
      # `main`, or the queue commit of the PR ahead, so only this PR's lines count.
      - name: Gate the changed lines
        shell: bash
        run: |
          pnpm test:mutation:diff \
            '${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}' \
            HEAD \
            --incremental | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-pr
          # The baseline is excluded: a copy of the restored cache entry, ~2 MB.
          path: |
            reports/mutation/
            !reports/mutation/stryker-incremental.json
          retention-days: 7
          if-no-files-found: warn

  baseline:
    name: Full scope
    # Never on `merge_group`: the baseline is the cache's only writer, and a
    # queue commit is not `main` yet.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # A cold run no longer fits one job, so the budget lives on the Stryker
    # step (below) and this is only the hang backstop above it. Queue, never
    # cancel: a cancelled baseline saves nothing, and a busy `main` cancelled
    # every one. ADR section 4.
    # 75 + 2 for the step, ~15 for a cold install, the canary, the save and the upload.
    timeout-minutes: 95
    concurrency:
      group: mutation-baseline
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/mutation-baseline
        id: cache

      # Same canary as the PR job. On `main` it is what keeps a merged bump from
      # leaving a whole baseline of replayed, meaningless verdicts behind.
      - name: Canary — is the mutation gate still measuring anything?
        shell: bash
        run: pnpm test:mutation:canary | tee -a "$GITHUB_STEP_SUMMARY"

      # Reports, never `break`s. No `--`: pnpm forwards the separator itself.
      # Step-scoped secret, so only the baseline can publish — same rule as the cache.
      # `timeout -s INT`, not the job timeout: on SIGINT Stryker writes a partial
      # incremental report the next run resumes from, and the step *fails*
      # (exit 124) where a job timeout only cancels, which notifies nobody.
      # pnpm waits for Stryker on SIGINT: measured, the file is complete and no
      # Stryker process is left when `timeout` returns.
      - name: Run the full scope
        id: stryker
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
        run: timeout --signal=INT --kill-after=2m 75m pnpm test:mutation --incremental

      - name: Score summary
        if: always()
        run: pnpm test:mutation:summary >> "$GITHUB_STEP_SUMMARY"

      # A partial report is safe to publish: it holds every result reused from
      # the restored baseline plus this run's, and Stryker re-runs whatever is
      # missing. Only an unreadable file must not be saved, nor the restored one
      # again when Stryker never ran (setup or canary failed).
      - name: Check the baseline file
        id: baseline-file
        if: always() && (steps.stryker.outcome == 'success' || steps.stryker.outcome == 'failure')
        run: |
          node -e '
            const r = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            if (Object.keys(r.files ?? {}).length === 0) process.exit(1);
          ' reports/mutation/stryker-incremental.json \
            && echo "usable=true" >> "$GITHUB_OUTPUT" \
            || echo "usable=false" >> "$GITHUB_OUTPUT"

      - name: Save the refreshed baseline
        # The only writer, complete or partial (see above).
        if: always() && steps.baseline-file.outputs.usable == 'true'
        uses: actions/cache/save@v6
        with:
          path: reports/mutation/stryker-incremental.json
          key: ${{ steps.cache.outputs.exact }}

      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-baseline
          path: |
            reports/mutation/
            !reports/mutation/stryker-incremental.json
          retention-days: 30
          if-no-files-found: warn

  # A red baseline on `main` notifies nobody by itself: the push actor is often
  # Renovate, and nothing else watches the job. One labelled issue does: opened
  # (or commented) on every failed run, closed by the next success.
  # `failure` only: GitHub cancels a *waiting* baseline when a newer push queues,
  # which is not a failure; a real timeout fails the step (see above). `main`
  # only: a dispatch on a branch says nothing about `main`.
  baseline-alert:
    name: Baseline alert
    needs: baseline
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (needs.baseline.result == 'success' || needs.baseline.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Two alerts at once would both find no open issue and both open one.
    concurrency:
      group: mutation-baseline-alert
      cancel-in-progress: false
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        env:
          RESULT: ${{ needs.baseline.result }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const label = 'mutation-baseline';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const sha = context.sha.slice(0, 7);
            const failed = process.env.RESULT === 'failure';

            // This endpoint also lists pull requests; a labelled PR must never be closed here.
            const { data: open } = await github.rest.issues.listForRepo({
              owner, repo, labels: label, state: 'open', per_page: 100,
            });
            const issue = open.find((item) => !item.pull_request);

            if (!failed) {
              if (issue) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: `Recovered: the baseline completed on \`${sha}\` (${runUrl}).`,
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: issue.number,
                  state: 'closed', state_reason: 'completed',
                });
              }
              return;
            }

            const line = `The \`Full scope\` job ended \`${process.env.RESULT}\` on \`${sha}\`: ${runUrl}`;
            if (issue) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: line });
              return;
            }
            try {
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: 'b60205',
                description: 'The mutation baseline on main is failing',
              });
            } catch (err) {
              if (err.status !== 422) throw err; // 422: the label already exists
            }
            await github.rest.issues.create({
              owner, repo, labels: [label],
              title: 'Mutation baseline is failing on main',
              body: [
                line,
                '',
                'Each failed run saves its partial baseline, so the next one resumes rather than restarting;',
                'a run that keeps failing at the step timeout means the scope outgrew it.',
                'This issue closes itself on the next successful run.',
                'Background: docs/decisions/mutation-testing.md, section 4.',
              ].join('\n'),
            });
