name: Mutation testing

# Two jobs with different questions.
#
# `diff-gate` (pull requests) asks "did this PR test what it changed?". It
# mutates only the changed *lines* and fails if any of those mutants survived.
# Scoping to lines rather than files is what keeps it fair: touching one line of
# a file with weak legacy tests must not fail on that file's history.
#
# `baseline` (push to main, or on demand) asks "where does the whole scope
# stand?" and refreshes the incremental cache the PR job restores. It is the
# only writer of that cache — a PR run is diff-scoped, so if it wrote back it
# would publish a truncated baseline for every later PR.
#
# The design and the measurements behind it: docs/decisions/mutation-testing.md

on:
  # Deliberately unfiltered: `Changed lines` is meant to be a required check,
  # and a path-filtered required check never reports at all, which would block
  # every docs-only PR forever. The job is cheap when the diff touches nothing
  # in scope — it says so and exits.
  pull_request:
  push:
    branches: [main]
    # The push job runs the *full* scope, so it is worth filtering: a docs or
    # workflow commit cannot change a single verdict, and after a quiet week
    # (Actions evicts caches unused for 7 days) it would rebuild cold.
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pnpm-lock.yaml'
      - 'stryker.config.mjs'
      - 'vitest.config.ts'
      - '.nvmrc'
      - 'scripts/mutation-scope.mjs'
      - '.github/workflows/mutation.yml'
      - '.github/actions/mutation-baseline/action.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diff-gate:
    name: Changed lines
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # A diff-scoped run is normally under a minute; this is slack for a PR that
    # touches a lot of logic at once, or a cold cache.
    timeout-minutes: 25
    # Draft-early, push-often is the documented workflow (AGENTS.md), so
    # superseded runs are the common case, not the exception.
    concurrency:
      group: mutation-gate-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          # The gate diffs base...head, so both commits have to be present.
          fetch-depth: 0
          # Neither job pushes, and both run `pnpm install`, which executes
          # dependency lifecycle scripts — no reason to leave a usable git
          # credential on disk for them (zizmor `artipacked`).
          persist-credentials: false

      - uses: ./.github/actions/mutation-baseline

      # One command: derives the scope, mutates it, and judges the report it
      # just produced. Splitting it would let a stale scope be paired with a
      # fresh report, which reads as a confident verdict about the wrong lines.
      #
      # `--incremental` is safe here and nowhere else by default: the baseline is
      # only on disk when a key matched, and the key encodes every input
      # incremental mode cannot detect for itself.
      - name: Gate the changed lines
        # `shell: bash` is load-bearing, not decoration: it runs the step as
        # `bash --noprofile --norc -eo pipefail`, whereas the default is `bash -e`
        # with NO pipefail. Without it the pipe into `tee` reports tee's status,
        # so a run with escaped mutants exits 1 and the step still passes —
        # measured, exit 0 vs exit 1, with "Escaped: 4" printed in the summary.
        # That would have made the gate report success on the failures it exists
        # to catch, which is worse than not having it: the green check reads as
        # evidence.
        shell: bash
        run: |
          node scripts/mutation-scope.mjs diff \
            '${{ github.event.pull_request.base.sha }}' \
            '${{ github.event.pull_request.head.sha }}' \
            --incremental | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-pr
          # The incremental baseline is excluded: it is a copy of the cache entry
          # this job restored (~2 MB) and nothing consumes it from the artifact.
          path: |
            reports/mutation/
            !reports/mutation/stryker-incremental.json
          retention-days: 7
          if-no-files-found: warn

  baseline:
    name: Full scope
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # A cold run over the configured scope is ~1 700 mutants, measured at roughly
    # an hour on 4 cores. That only happens when the cache prefix changed; an
    # ordinary push to main reuses the baseline and finishes in minutes.
    timeout-minutes: 120
    # Superseding pushes make an in-flight baseline pointless.
    concurrency:
      group: mutation-baseline
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/mutation-baseline
        id: cache

      # Never `break`s: this job reports and refreshes the baseline. The gate
      # belongs on the diff, in the job above. Reporters come from the config.
      # No `--` before the flag: pnpm 11 forwards the separator itself, and
      # `stryker run -- --incremental` fails with "too many arguments".
      - run: pnpm test:mutation --incremental

      - name: Score summary
        if: always()
        run: node scripts/mutation-scope.mjs summary >> "$GITHUB_STEP_SUMMARY"

      - name: Save the refreshed baseline
        # The only writer. Skipped on a failed or cancelled run so a partial
        # baseline never becomes the one every PR restores.
        if: success()
        uses: actions/cache/save@v6
        with:
          path: reports/mutation/stryker-incremental.json
          key: ${{ steps.cache.outputs.exact }}

      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-baseline
          path: |
            reports/mutation/
            !reports/mutation/stryker-incremental.json
          retention-days: 30
          if-no-files-found: warn
