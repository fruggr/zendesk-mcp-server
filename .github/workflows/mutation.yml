name: Mutation testing

# `diff-gate` mutates a PR's changed *lines*; `baseline` runs the full scope on
# main and is the only writer of the incremental cache the gate restores.
# Design, costs and the reasoning behind every choice below:
# docs/decisions/mutation-testing.md

on:
  # Both unfiltered on purpose: a path-filtered *required* check never reports,
  # and a `paths:` list here would be a second copy of the cache key's rule. Why
  # that trade is right: the ADR, §4.
  pull_request:
  # `Changed lines` is a required check: it must report on the queue's commit too.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One baseline at a time, end to end (plan, shards, merge): queued, never
# cancelled, since a cancelled baseline saves nothing. GitHub keeps one waiting
# run and cancels an older waiting one, which the alert ignores. Pull request and
# merge-queue runs each get a group of their own, so this never holds them.
# Not `mutation-baseline`: that name is the old single-job baseline's group, and
# sharing it made a run of this pipeline wait behind one of those. Per ref: a
# test dispatch on a branch must not replace main's waiting baseline.
concurrency:
  group: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && format('mutation-baseline-sharded-{0}', github.ref) || format('mutation-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  diff-gate:
    name: Changed lines
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    # Normally under a minute; slack for a lot of logic at once, or a cold cache.
    timeout-minutes: 25
    concurrency:
      group: mutation-gate-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the gate diffs the PR base against this merge commit
          persist-credentials: false # neither job pushes (zizmor `artipacked`)

      - uses: ./.github/actions/mutation-baseline

      # Before the gate, and unconditionally. A dependency-only PR changes no
      # mutated line, so the gate below finds nothing to judge and reports a
      # vacuous pass — which is exactly how #292 switched the gate off without a
      # single red check. The canary mutates a two-line fixture whose verdicts
      # are fixed by construction, so it is the one signal such a PR gets. ~3 s.
      # `shell: bash` for `-eo pipefail`, same reason as the gate step below.
      - name: Canary — is the mutation gate still measuring anything?
        shell: bash
        run: pnpm test:mutation:canary | tee -a "$GITHUB_STEP_SUMMARY"

      # Two things here are load-bearing and look removable. `shell: bash` gives
      # `-eo pipefail`; the default `bash -e` has none, so `tee` would swallow the
      # gate's exit 1 and every failure would report green (measured). `HEAD`, not
      # `head.sha`: checkout gives us the merge commit, and the line numbers must
      # match the tree Stryker mutates. Both explained in full in the ADR, §4.
      # In the merge queue, HEAD is the queue commit and `base_sha` its parent:
      # `main`, or the queue commit of the PR ahead, so only this PR's lines count.
      - name: Gate the changed lines
        shell: bash
        run: |
          pnpm test:mutation:diff \
            '${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}' \
            HEAD \
            --incremental | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-pr
          # The baseline is excluded: a copy of the restored cache entry, ~2 MB.
          path: |
            reports/mutation/
            !reports/mutation/stryker-incremental.json
          retention-days: 7
          if-no-files-found: warn

  # The full baseline, in three steps. A cold run costs ~4 h, and an interrupted
  # Stryker did not reliably save its partial report in CI (#451), so the work is
  # split into shards of chunks that each *finish*: under `--incremental` with a
  # narrowed `--mutate`, Stryker still writes the whole project's report, so a
  # finished chunk is progress kept. scripts/mutation-shards.mjs, ADR section 4.
  # Never on `merge_group`: the baseline is the cache's only writer, and a queue
  # commit is not `main` yet.
  baseline-plan:
    name: Baseline plan
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/mutation-baseline

      # Same canary as the PR job, once per baseline. On `main` it is what keeps
      # a merged bump from leaving a baseline of replayed, meaningless verdicts.
      - name: Canary — is the mutation gate still measuring anything?
        shell: bash
        run: pnpm test:mutation:canary | tee -a "$GITHUB_STEP_SUMMARY"

      # Balanced on what each file cost last time (tests its mutants ran), or on
      # its size when there is no baseline yet.
      - name: Plan the shards
        id: plan
        run: |
          shards=$(node scripts/mutation-shards.mjs plan --shards 10 --chunks 3 \
            --baseline reports/mutation/stryker-incremental.json)
          echo "shards=${shards}" >> "$GITHUB_OUTPUT"

  baseline-shard:
    name: Shard ${{ matrix.shard.index }}
    needs: baseline-plan
    runs-on: ubuntu-latest
    # 75 + 2 for the step, the rest for a cold install and the upload.
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.baseline-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/mutation-baseline

      # The step budget is a backstop: a shard that overruns keeps every chunk it
      # finished (recorded after each one), and the step fails, which the alert
      # reports. SIGKILL, not SIGINT: a SIGINT reaches Stryker's test workers too,
      # and Stryker then hangs instead of saving (measured), so a graceful stop
      # buys nothing here.
      - name: Run the shard
        env:
          SHARD_CHUNKS: ${{ toJSON(matrix.shard.chunks) }}
          # Recorded with the chunk timings, for the drift check after the merge.
          SHARD_INDEX: ${{ matrix.shard.index }}
          SHARD_COST: ${{ matrix.shard.cost }}
        run: timeout --signal=KILL 75m node scripts/mutation-shards.mjs run-shard

      - name: Upload what the shard finished
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-shard-${{ matrix.shard.index }}
          path: reports/shard/
          retention-days: 1
          if-no-files-found: ignore

  baseline:
    name: Full scope
    needs: [baseline-plan, baseline-shard]
    # Whatever the shards did: each one that finished anything is worth merging.
    # Not after a manual cancel, though.
    if: ${{ !cancelled() && needs.baseline-plan.result == 'success' }}
    runs-on: ubuntu-latest
    # 75 for the step, ~15 for a cold install, the merge, the saves and the upload.
    timeout-minutes: 95
    outputs:
      drifted: ${{ steps.drift.outputs.drifted }}
      drift-escalate: ${{ steps.drift.outputs.escalate }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/mutation-baseline
        id: cache

      # No match is not an error for this action (the merge then keeps the
      # restored baseline); a failed download is, and must not pass silently.
      - name: Download the shards
        uses: actions/download-artifact@v8
        with:
          pattern: mutation-shard-*
          path: shards

      - name: Merge the shards into the baseline
        id: merge
        shell: bash
        run: |
          shopt -s nullglob
          # One matching artifact is extracted into shards/ itself, several into
          # one subdirectory each.
          if [[ -f shards/done.json || -f shards/stryker-incremental.json ]]; then
            dirs=(shards)
          else
            dirs=(shards/*/)
          fi
          merged=$(node scripts/mutation-shards.mjs merge \
            --out reports/mutation/stryker-incremental.json \
            --fallback reports/mutation/stryker-incremental.json \
            "${dirs[@]}")
          echo "shards=${merged}" >> "$GITHUB_OUTPUT"

      # Anti-drift: is the plan still fitting? One table in the job summary, an
      # annotation per warning (a shard over 60 % of its 75 min budget, or the
      # slowest over 1.5 times the mean once past 15 min), never a red run. The history is what
      # turns three drifting runs in a row into an issue (alert job). ADR §4.
      - name: Restore the drift history
        uses: actions/cache/restore@v6
        with:
          path: reports/drift-history.json
          key: mutation-drift-history-${{ github.run_id }}
          restore-keys: mutation-drift-history-

      # Never blocks what follows: the merged baseline and the full pass matter
      # more than a report about them.
      - name: Check the shards for drift
        id: drift
        continue-on-error: true
        shell: bash
        env:
          # Every planned shard gets a row, including one that left no timing.
          SHARD_PLAN: ${{ needs.baseline-plan.outputs.shards }}
        run: |
          shopt -s nullglob
          if [[ -f shards/timing.json ]]; then dirs=(shards); else dirs=(shards/*/); fi
          node scripts/mutation-shards.mjs drift --budget-minutes 75 \
            --history reports/drift-history.json --history-out reports/drift-history.json \
            --summary "$GITHUB_STEP_SUMMARY" "${dirs[@]}"

      - name: Save the drift history
        if: steps.drift.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: reports/drift-history.json
          key: mutation-drift-history-${{ github.run_id }}-${{ github.run_attempt }}

      # Saved before the full pass below, so the shards' work is kept even if
      # that pass is cut off. Not when no shard handed anything over: the file
      # would only be the restored one again.
      - name: Save the merged baseline
        if: steps.merge.outputs.shards != '0'
        uses: actions/cache/save@v6
        with:
          path: reports/mutation/stryker-incremental.json
          key: ${{ steps.cache.outputs.exact }}-shards

      # Warm: reuses every verdict the shards produced, and re-runs only what a
      # failed shard left. It writes the HTML/JSON reports and publishes the
      # score. Reports, never `break`s. Step-scoped secret, so only the baseline
      # can publish — same rule as the cache.
      - name: Run the full scope
        id: stryker
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
        run: timeout --signal=KILL 75m pnpm test:mutation --incremental

      - name: Score summary
        if: always()
        run: pnpm test:mutation:summary >> "$GITHUB_STEP_SUMMARY"

      # Only after a full pass that finished: a killed one writes nothing, and the
      # merged file is already saved above. An unreadable file is never saved.
      - name: Check the baseline file
        id: baseline-file
        if: always() && steps.stryker.outcome == 'success'
        run: |
          node -e '
            const r = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            if (Object.keys(r.files ?? {}).length === 0) process.exit(1);
          ' reports/mutation/stryker-incremental.json \
            && echo "usable=true" >> "$GITHUB_OUTPUT" \
            || echo "usable=false" >> "$GITHUB_OUTPUT"

      - name: Save the refreshed baseline
        if: always() && steps.baseline-file.outputs.usable == 'true'
        uses: actions/cache/save@v6
        with:
          path: reports/mutation/stryker-incremental.json
          key: ${{ steps.cache.outputs.exact }}

      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-baseline
          path: |
            reports/mutation/
            !reports/mutation/stryker-incremental.json
          retention-days: 30
          if-no-files-found: warn

  # A red baseline on `main` notifies nobody by itself: the push actor is often
  # Renovate, and nothing else watches the job. One labelled issue does: opened
  # (or commented) on every failed run, closed by the next success.
  # `failure` only: GitHub cancels a *waiting* baseline when a newer push queues,
  # which is not a failure; a real timeout fails the step (see above). `main`
  # only: a dispatch on a branch says nothing about `main`.
  baseline-alert:
    name: Baseline alert
    needs: [baseline-plan, baseline-shard, baseline]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (needs.baseline.result == 'success' || needs.baseline.result == 'failure' ||
      needs.baseline-plan.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Two alerts at once would both find no open issue and both open one.
    concurrency:
      group: mutation-baseline-alert
      cancel-in-progress: false
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        env:
          # The first job that failed, in pipeline order: a shard that overran is
          # a failure too, even when the full pass made up for it.
          FAILED_JOB: >-
            ${{ needs.baseline-plan.result == 'failure' && 'Baseline plan' ||
            needs.baseline-shard.result == 'failure' && 'Shard' ||
            needs.baseline.result == 'failure' && 'Full scope' || '' }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const label = 'mutation-baseline';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const sha = context.sha.slice(0, 7);
            const failedJob = process.env.FAILED_JOB.trim();
            const failed = failedJob !== '';

            // This endpoint also lists pull requests; a labelled PR must never be closed here.
            const { data: open } = await github.rest.issues.listForRepo({
              owner, repo, labels: label, state: 'open', per_page: 100,
            });
            const issue = open.find((item) => !item.pull_request);

            if (!failed) {
              if (issue) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: `Recovered: the baseline completed on \`${sha}\` (${runUrl}).`,
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: issue.number,
                  state: 'closed', state_reason: 'completed',
                });
              }
              return;
            }

            const line = `The \`${failedJob}\` job failed on \`${sha}\`: ${runUrl}`;
            if (issue) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: line });
              return;
            }
            try {
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: 'b60205',
                description: 'The mutation baseline on main is failing',
              });
            } catch (err) {
              if (err.status !== 422) throw err; // 422: the label already exists
            }
            await github.rest.issues.create({
              owner, repo, labels: [label],
              title: 'Mutation baseline is failing on main',
              body: [
                line,
                '',
                '- `Baseline plan`: the canary or the shard plan failed; nothing ran.',
                '- `Shard`: a shard failed or overran; the chunks it finished are kept, so a shard that',
                '  keeps overrunning means the plan needs more shards or chunks.',
                '- `Full scope`: the merge or the final pass failed; the merged shards are already saved.',
                'This issue closes itself on the next successful run.',
                'Background: docs/decisions/mutation-testing.md, section 4.',
              ].join('\n'),
            });

      # Drift is not a failure: the run stays green. Three drifting runs in a
      # row open one issue (labelled apart from the failure one); the first
      # run without drift closes it.
      - name: Report shard drift
        if: needs.baseline.result == 'success'
        uses: actions/github-script@v9
        env:
          DRIFTED: ${{ needs.baseline.outputs.drifted }}
          ESCALATE: ${{ needs.baseline.outputs.drift-escalate }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const label = 'mutation-baseline-drift';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner, repo, labels: label, state: 'open', per_page: 100,
            });
            const issue = open.find((item) => !item.pull_request);

            // Empty when the drift step itself failed: nothing was measured.
            if (process.env.DRIFTED === '') return;
            if (process.env.DRIFTED !== 'true') {
              if (issue) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: `Back in bounds on this run: ${runUrl}`,
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'completed',
                });
              }
              return;
            }
            if (process.env.ESCALATE !== 'true') return;

            const line = `Shard drift again on this run (third in a row or more): ${runUrl}`;
            if (issue) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: line });
              return;
            }
            try {
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: 'fbca04',
                description: 'Mutation shards drifting from their budget or balance',
              });
            } catch (err) {
              if (err.status !== 422) throw err; // 422: the label already exists
            }
            await github.rest.issues.create({
              owner, repo, labels: [label],
              title: 'Mutation shards are drifting',
              body: [
                line,
                '',
                'The last three baselines on main each warned that a shard used more than 60 % of its',
                '75 min budget, or that the slowest shard (past 15 min) took more than 1.5 times the mean.',
                'The runs stay green; this is the early warning before a shard overruns. The table is in each',
                "run's job summary (Full scope). Usual fixes: more shards or chunks (`--shards`,",
                '`--chunks` in mutation.yml), or look at what made a file more expensive.',
                'This issue closes itself on the next run without drift.',
                'Background: docs/decisions/mutation-testing.md, section 4.',
              ].join('\n'),
            });
