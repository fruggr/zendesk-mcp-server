name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          # Single source of truth for the tooling Node version: .nvmrc.
          # ci.yml uses the same file. Node 20 compatibility (the floor
          # declared in package.json#engines.node) is verified by the
          # `smoke-node20` job in ci.yml, which installs the packed tarball
          # on Node 20 and runs the smoke test.
          node-version-file: .nvmrc
          cache: pnpm
          # No `registry-url`: with NPM Trusted Publishing, the OIDC exchange
          # happens inside @semantic-release/npm. Letting setup-node write
          # an ~/.npmrc with an `_authToken=${NODE_AUTH_TOKEN}` placeholder
          # would either require us to re-introduce NPM_TOKEN or break the
          # pre-publish `npm whoami` check.

      - name: Upgrade npm to a version that supports OIDC Trusted Publishing
        # Full Trusted Publishing OIDC (publish without NPM_TOKEN, using
        # only id-token: write) needs npm >= 11.5.1. @semantic-release/npm
        # shells out to the npm CLI, so it is the global npm version that
        # matters here. Kept as a defensive upgrade even when the Node
        # release bundles a newer npm — it's a no-op if already satisfied.
        run: npm install -g npm@^11.5.1

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - run: node scripts/smoke-test.mjs

      # Snapshot the version before semantic-release. @semantic-release/npm
      # rewrites package.json#version in the working tree during its prepare
      # step, so a change here is the signal that a release was actually cut
      # (chore/docs-only pushes produce no release and must not republish).
      - name: Snapshot version before release
        id: before
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Auth to npm is via NPM Trusted Publishing (OIDC), configured on
          # npmjs.com against this workflow file. The `id-token: write`
          # permission above is all that's needed — no NPM_TOKEN secret.
          # Verbose logging so the next failure is debuggable from the run
          # log alone (the OIDC publish step previously exit-1'd without
          # surfacing the actual npm error).
          DEBUG: 'semantic-release:*'
          NPM_CONFIG_LOGLEVEL: verbose

      # --- Mirror the release into the official MCP registry ---
      # registry.modelcontextprotocol.io is increasingly the default discovery
      # surface for MCP-aware clients. We publish here right after npm so the
      # listing tracks every release with no manual step. Auth reuses the
      # workflow's `id-token: write` (GitHub OIDC) — no extra secret. Ownership
      # of the npm package is proven by the `mcpName` field in package.json.
      - name: Detect whether a release was published
        id: released
        env:
          # Route the GitHub expression through env rather than templating it
          # into the script source (avoids any shell-quoting surprises).
          BEFORE: ${{ steps.before.outputs.version }}
        run: |
          after="$(node -p "require('./package.json').version")"
          if [ "$BEFORE" != "$after" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "version=$after" >> "$GITHUB_OUTPUT"
            echo "Release $after detected; will publish to the MCP registry."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "No release this run; skipping MCP registry publish."
          fi

      - name: Sync server.json to the released version
        if: steps.released.outputs.published == 'true'
        env:
          VERSION: ${{ steps.released.outputs.version }}
        run: |
          jq --arg v "$VERSION" \
            '.version = $v | .packages[0].version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json

      - name: Install mcp-publisher
        if: steps.released.outputs.published == 'true'
        env:
          # Pinned (not `latest`) and checksum-verified before it runs in this
          # OIDC-privileged job. Bump from the modelcontextprotocol/registry
          # releases when a newer publisher is needed.
          MCP_PUBLISHER_VERSION: '1.7.9'
        run: |
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          asset="mcp-publisher_${os}_${arch}.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}"
          curl -fsSL -o "$asset" "$base/$asset"
          curl -fsSL -o checksums.txt "$base/registry_${MCP_PUBLISHER_VERSION}_checksums.txt"
          grep " ${asset}$" checksums.txt | sha256sum -c -
          tar xzf "$asset" mcp-publisher
          rm -f "$asset" checksums.txt

      - name: Authenticate to the MCP registry (GitHub OIDC)
        if: steps.released.outputs.published == 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP registry
        if: steps.released.outputs.published == 'true'
        env:
          VERSION: ${{ steps.released.outputs.version }}
        run: |
          # The registry validates by fetching the npm tarball; allow a few
          # retries for npm propagation right after publish.
          attempts=5
          for attempt in $(seq 1 "$attempts"); do
            if ./mcp-publisher publish; then
              echo "Published $VERSION to the MCP registry."
              exit 0
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              echo "Publish attempt $attempt failed; retrying in $((attempt * 10))s..."
              sleep "$((attempt * 10))"
            fi
          done
          echo "MCP registry publish failed after $attempts attempts." >&2
          exit 1
