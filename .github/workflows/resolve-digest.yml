name: Resolve base digests (temporary)

# Temporary: prints the index digests of the target DHI tags so the Dockerfile
# can pin them. Removed in the next commit of this PR.
on:
  pull_request:
    paths:
      - .github/workflows/resolve-digest.yml

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}
      - run: |
          for tag in 24.22.1-alpine3.24-dev 24.22.1-alpine3.24; do
            echo "$tag $(docker buildx imagetools inspect "dhi.io/node:$tag" --format '{{json .Manifest}}' | jq -r .digest)"
          done
