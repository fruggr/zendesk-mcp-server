name: CodeQL

# Advanced setup, replacing code scanning's default setup: default setup skips
# pull requests from forks, so the required `CodeQL` check never reported on
# them and they could not be merged. Why, and the admin switch this needs:
# docs/decisions/codeql-advanced-setup.md

on:
  push:
    branches: [main]
  # Never `pull_request_target`: fork code would then run with a write token and
  # the repository's secrets. Unfiltered, as a required check must be.
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      # Same category as default setup, so existing alerts carry over instead
      # of being duplicated.
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
