name: Container

# Builds and smoke-tests the image on a PR only when something that shapes it
# changes; a source-only change is already covered by the bundle suite in ci.yml.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsdown.config.ts
      - scripts/bundle-manifest.mjs
      - scripts/container-smoke.mjs
      - .github/workflows/container.yml
      - .github/actions/publish-image/**

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: docker/setup-buildx-action@v4

      # A repository secret, not the release environment's: PR branches run here.
      # Read-only, and only able to pull public Docker Hardened Images.
      - uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      # TEMPORARY: resolve the base digests to pin in the Dockerfile (no local
      # Docker to run this). Removed in the commit that pins them.
      - name: Resolve the DHI base digests
        run: |
          for tag in 24-alpine3.24-dev 24-alpine3.24; do
            digest=$(docker buildx imagetools inspect "dhi.io/node:$tag" --format '{{json .Manifest.Digest}}')
            echo "dhi.io/node:$tag $digest" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: zendesk-mcp-server:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: node scripts/container-smoke.mjs zendesk-mcp-server:candidate
